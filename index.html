<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FC={R:['x',1],L:['x',-1],U:['y',1],D:['y',-1],F:['z',1],B:['z',-1],M:['x',-1],E:['y',-1],S:['z',1],x:['x',1],y:['y',1],z:['z',1]},DR={R:[1,0,0],L:[-1,0,0],U:[0,1,0],D:[0,-1,0],F:[0,0,1],B:[0,0,-1]};

const CN={R:'右',L:'左',U:'上',D:'下',F:'前',B:'后',M:'M 中层（同 L 方向）',E:'E 中层（同 D 方向）',S:'S 中层（同 F 方向）',x:'整体 x（同 R）',y:'整体 y（同 U）',z:'整体 z（同 F）'};
// ---- 3D ----
const wr=$('#cv'),RD=new THREE.WebGLRenderer({antialias:true,alpha:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,100);cam.position.set(0,0,10);
wr.appendChild(RD.domElement);sc.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(3,6,8);sc.add(dl);
const cg=new THREE.Group();cg.rotation.order='YXZ';cg.rotation.x=.5;cg.rotation.y=-.7;sc.add(cg);const pv=new THREE.Object3D();cg.add(pv);
const cubies=[],bg=new THREE.BoxGeometry(.97,.97,.97),bm=new THREE.MeshLambertMaterial({color:0x15171a}),sg=new THREE.PlaneGeometry(.82,.82),V=THREE.Vector3;
for(let x=-1;x<2;x++)for(let y=-1;y<2;y++)for(let z=-1;z<2;z++){const g=new THREE.Group();g.userData.p=[x,y,z];g.add(new THREE.Mesh(bg,bm));
for(const f in DR){const d=DR[f];if(d[0]*x+d[1]*y+d[2]*z===1){const m=new THREE.Mesh(sg,new THREE.MeshLambertMaterial({color:CL[f]})),n=new V(...d);m.quaternion.setFromUnitVectors(new V(0,0,1),n);m.position.copy(n).multiplyScalar(.49);m.userData={f,n,s:1};g.add(m)}}
cg.add(g);cubies.push(g)}
function resetCube(){cubies.forEach(c=>{c.position.set(...c.userData.p);c.quaternion.identity()})}
function size(){const w=wr.clientWidth,h=wr.clientHeight;RD.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
let dg=null;RD.domElement.addEventListener('pointerdown',e=>{dg=[e.clientX,e.clientY];RD.domElement.setPointerCapture(e.pointerId)});
addEventListener('pointerup',()=>dg=null);RD.domElement.addEventListener('pointermove',e=>{if(!dg)return;cg.rotation.y+=(e.clientX-dg[0])*.01;cg.rotation.x=Math.max(-1.4,Math.min(1.4,cg.rotation.x+(e.clientY-dg[1])*.01));dg=[e.clientX,e.clientY]});
// ---- moves ----
const Q=[];let cur=null;
const norm=s=>/^[rludfb]/.test(s)?s[0].toUpperCase()+'w'+s.slice(1):s;const valid=s=>/^([RLUDFB]w?|[MESxyz])(['2]?)$/.test(s);const pure=()=>tab==='timer';
const parse=s=>{const r=/^([RLUDFBMESxyz])(w?)(['2]?)$/.exec(norm(s));return{f:r[1],w:!!r[2],d:r[3]==="'"?-1:r[3]==='2'?2:1}};
const inv=s=>s.endsWith("'")?s.slice(0,-1):s.endsWith('2')?s:s+"'";const invA=a=>a.slice().reverse().map(inv);
const dur=()=>+$('#spd').value;
function begin(q){const m=q.m,[a,s]=FC[m.f],sel=cubies.filter(c=>{const v=Math.round(c.position[a]);return 'xyz'.includes(m.f)?true:'MES'.includes(m.f)?v===0:m.w?v*s>=0:v===s});
cur={q,a,g:-s*m.d*Math.PI/2,s:performance.now(),sel};sel.forEach(c=>pv.attach(c))}
function snap(c){c.position.set(Math.round(c.position.x),Math.round(c.position.y),Math.round(c.position.z));const m=new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);m.elements=m.elements.map(Math.round);c.quaternion.setFromRotationMatrix(m)}
function end(){pv.rotation[cur.a]=cur.g;pv.updateMatrixWorld(true);cur.sel.forEach(c=>{cg.attach(c);snap(c)});pv.rotation.set(0,0,0);const q=cur.q;cur=null;done(q)}
function instant(s){begin({m:parse(s)});end()}
function flush(){if(cur)end();Q.length=0}
function anim(){if(!cur&&Q.length)begin(Q.shift());if(cur){const p=Math.min(1,(performance.now()-cur.s)/dur()),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;pv.rotation[cur.a]=cur.g*e;if(p>=1)end()}}
// ---- state checks ----
function cen(){const C={};cubies.forEach(c=>{const p=c.position;if(Math.abs(p.x)+Math.abs(p.y)+Math.abs(p.z)===1)C[NF[[Math.round(p.x),Math.round(p.y),Math.round(p.z)].join()]]=c.children[1].userData.f});return C}
const nowF=(c,s)=>{const n=s.userData.n.clone().applyQuaternion(c.quaternion);return NF[[Math.round(n.x),Math.round(n.y),Math.round(n.z)].join()]};
function ok(pred){const C=cen();return cubies.every(c=>{const p=c.position;if(!pred(Math.round(p.x),Math.round(p.y),Math.round(p.z)))return true;return c.children.every(s=>!s.userData.s||s.userData.f===C[nowF(c,s)])})}
function ollTop(){const C=cen();return cubies.every(c=>c.children.every(s=>!s.userData.s||nowF(c,s)!=='U'||s.userData.f===C.U))}
const solved=()=>ok(()=>true),lay=y0=>ok((x,y)=>y<=y0),blk=s=>ok((x,y)=>x===s&&y<=0);
const MT={CFOP:[['Cross',()=>ok((x,y,z)=>y===-1&&Math.abs(x)+Math.abs(z)===1)],['F2L',()=>lay(0)],['OLL',()=>lay(0)&&ollTop()],['PLL',solved]],
LBL:[['第一层',()=>lay(-1)],['第二层',()=>lay(0)],['最后一层',solved]],
Roux:[['First Block',()=>blk(-1)||blk(1)],['Second Block',()=>blk(-1)&&blk(1)],['CMLL',()=>blk(-1)&&blk(1)&&ok((x,y,z)=>Math.abs(x)+Math.abs(y)+Math.abs(z)===3)],['LSE',solved]]};
// ---- algs ----
const ALGS=[{n:'Sune',s:'OLL',a:"R U R' U R U2 R'"},{n:'Anti-Sune',s:'OLL',a:"R U2 R' U' R U' R'"},{n:'线型 OLL',s:'OLL',a:"F R U R' U' F'"},
{n:'T-Perm',s:'PLL',a:"R U R' U' R' F R2 U' R' U' R U R' F'"},{n:'Y-Perm',s:'PLL',a:"F R U' R' U' R U R' F' R U R' U' R' F R F'"},{n:'Ua-Perm',s:'PLL',a:"R U' R U R U R U' R' U' R2"},{n:'Ub-Perm',s:'PLL',a:"R2 U R U R' U' R' U' R' U R'"},{n:'Jb-Perm',s:'PLL',a:"R U R' F' R U R' U' R' F R2 U' R'"}];
const AL=LS.get('sc_alg',{});let AF='all';
const PLL21=[['Aa',`x R' U R' D2 R U' R' D2 R2`],['Ab',`x R2 D2 R U R' D2 R U' R`],['E',`x' R U' R' D R U R' D' R U R' D R U' R' D'`],['F',`R' U' F' R U R' U' R' F R2 U' R' U' R U R' U R`],['Ga',`R2 U R' U R' U' R U' R2 U' D R' U R D'`],['Gb',`R' U' R U D' R2 U R' U R U' R U' R2 D`],['Gc',`R2 U' R U' R U R' U R2 U D' R U' R' D`],['Gd',`R U R' U' D R2 U' R U' R' U R' U R2 D'`],['H',`M2 U M2 U2 M2 U M2`],['Ja',`x R2 F R F' R U2 r' U r U2`],['Jb',`R U R' F' R U R' U' R' F R2 U' R'`],['Na',`R U R' U R U R' F' R U R' U' R' F R2 U' R' U2 R U' R'`],['Nb',`R' U R U' R' F' U' F R U R' F R' F' R U' R`],['Ra',`R U' R' U' R U R D R' U' R D' R' U2 R'`],['Rb',`R' U2 R U2 R' F R U R' U' R' F' R2`],['T',`R U R' U' R' F R2 U' R' U' R U R' F'`],['Ua',`R U' R U R U R U' R' U' R2`],['Ub',`R2 U R U R' U' R' U' R' U R'`],['V',`R' U R' U' y R' F' R2 U' R' U R' F R F`],['Y',`F R U' R' U' R U R' F' R U R' U' R' F R F'`],['Z',`M' U M2 U M2 U M' U2 M2`]];
ALGS.splice(3,ALGS.length,...PLL21.map(([n,a])=>({n:n+'-Perm',s:'PLL',a})));
// ---- timer ----
let D=LS.get('sc_solves',[]),S={mode:'idle',mv:[],ph:[],pi:0,scr:'',dirty:false,pen:0,sel:-1},hist=[],redo=[],tab='timer',rp=null;
const PH=()=>MT[S.method||$('#mth').value];
const fm=ms=>{if(ms===Infinity)return'DNF';const s=ms/1000;return s>=60?Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0'):s.toFixed(2)};
const val=s=>s.pen==='DNF'?Infinity:s.t+(s.pen===2?2000:0);
function ao(a,n){if(a.length<n)return null;const k=Math.ceil(n*.05),t=a.slice(-n).sort((x,y)=>x-y).slice(k,n-k);return t.includes(Infinity)?Infinity:t.reduce((p,c)=>p+c,0)/t.length}
function bestAo(a,n){let b=null;for(let i=n;i<=a.length;i++){const v=ao(a.slice(0,i),n);if(v!==null&&(b===null||v<b))b=v}return b}
function gen(t){if(t==='daily'){let h=0;for(const ch of new Date().toISOString().slice(0,10))h=(h*31+ch.charCodeAt(0))|0;const R0=Math.random;Math.random=()=>{h=(h+0x6D2B79F5)|0;let x=Math.imul(h^h>>>15,1|h);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};const r=gen('full');Math.random=R0;return r}let a=[];if(t==='pll'||t==='oll'){const L=ALGS.filter(x=>x.s===t.toUpperCase()),g=L[Math.random()*L.length|0];a=invA(g.a.split(' '));const u=['','U',"U'",'U2'][Math.random()*4|0];if(u)a.push(u)}
else{const n=t==='short'?8:20,ax=f=>FC[f][0];let p=[];while(p.length<n){const f='RLUDFB'[Math.random()*6|0],l=p[p.length-1],l2=p[p.length-2];if(f===l||(l&&ax(l)===ax(f)&&l2===f))continue;p.push(f)}a=p.map(f=>f+['',"'",'2'][Math.random()*3|0])}return a}
function newScramble(){const a=gen($('#styp').value);if(!pure()){flush();resetCube();a.forEach(instant)}S.scr=a.join(' ');S.dirty=false;hist=[];redo=[];$('#scr').textContent=S.scr;$('#st').textContent='按空格或点击时间开始'}
function userMove(ms,nh){ms=norm(ms);if(S.mode==='inspect'||rp||pure())return;let t=null;if(S.mode==='idle')S.dirty=true;if(S.mode==='solving'){t=performance.now()-S.t0;S.mv.push({m:ms,t})}
Q.push({m:parse(ms),rec:S.mode==='solving',t,idx:S.mv.length});if(!nh){hist.push(ms);redo.length=0}}
function done(q){if(!q.rec||S.mode!=='solving')return;const P=PH();while(S.pi<P.length&&P[S.pi][1]()){S.ph.push({n:P[S.pi][0],i:q.idx,t:q.t});S.pi++}if(solved())finish(q.t,q.idx)}

function disp(){if(S.mode==='solving')$('#tm').textContent=fm(performance.now()-S.t0);else if(S.mode==='inspect')$('#tm').textContent=Math.max(0,Math.ceil(15-(performance.now()-S.i0)/1000))}
function tiles(){const v=D.map(val),b=v.filter(x=>x<Infinity),f=x=>x===null?'-':fm(x);
$('#tt').innerHTML=[['Single',b.length?f(Math.min(...b)):'-'],['Ao5',f(ao(v,5))],['Ao12',f(ao(v,12))],['Ao50',f(ao(v,50))],['Ao100',f(ao(v,100))],['还原次数',D.length]].map(x=>`<div><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}
// ---- analysis ----
function analyze(s){const mv=s.mv,T=s.t,rows=[];let pe=0,pt=0;s.ph.forEach(p=>{const mc=p.i-pe,tm=p.t-pt;rows.push({n:p.n,mc,tm,tps:mc&&tm?mc/(tm/1000):0,first:mv[pe]?mv[pe].t-pt:0,sh:tm/T,a:pe,b:p.i});pe=p.i;pt=p.t});
const gp=mv.slice(1).map((m,i)=>m.t-mv[i].t),md=gp.slice().sort((a,b)=>a-b)[gp.length>>1]||0,th=Math.max(450,3*md),ps=gp.filter(g=>g>th);
let mg=0;mv.forEach((m,i)=>{if(i&&m.m[0]===mv[i-1].m[0])mg++});rows.forEach(x=>{x.pz=0;for(let k=x.a;k<x.b;k++){const g=k?mv[k].t-mv[k-1].t:mv[k].t;if(g>th)x.pz+=g}});let mx=0,mi=-1;gp.forEach((g,k)=>{if(g>mx){mx=g;mi=k+1}});return{rows,pc:ps.length,pa:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0,mg,tps:mv.length/(T/1000),th,mx,mi}}
function sug(s,r){const o=[],g=n=>r.rows.find(x=>x.n===n),sec=x=>(x/1000).toFixed(1);

function fix(n){if(LG!=='en'||n.nodeType!==3||!n.parentNode)return;const v=n.nodeValue;if(!CJ.test(v)||/^(SCRIPT|STYLE)$/.test(n.parentNode.tagName))return;const o=tr(v);if(o!==v){OR.set(n,v);n.nodeValue=o}}
function walk(r,f){const w=document.createTreeWalker(r,4);let n;while(n=w.nextNode())f(n)}
new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')fix(m.target);m.addedNodes.forEach(a=>a.nodeType===3?fix(a):a.nodeType===1&&walk(a,fix))})).observe(document.body,{childList:true,characterData:true,subtree:true});
function setLang(l){LG=l;LS.set('sc_lang',l);document.documentElement.lang=l==='en'?'en':'zh';$('#fi').placeholder=l==='en'?`Type alg, e.g. r U R' M2 x`:`输入公式，如 r U R' M2 x`;walk(document.body,n=>{if(l==='en')fix(n);else if(OR.has(n)){n.nodeValue=OR.get(n);OR.delete(n)}})}
